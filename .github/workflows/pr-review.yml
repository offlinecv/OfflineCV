#
# Automated PR review with Claude, running the repo's own /pr-review skill.
#
# Cooldown: every push restarts a 3-minute timer (the `cooldown` job's
# concurrency group cancels the previous run's timer), so the review runs once
# the author has stopped pushing for 3 minutes, not on every fixup push.
#
# Scope: same-repo PRs from authors with write access, not drafts. The skill
# checks out the branch and runs `npm install`, i.e. executes the PR's code
# with the Claude token in the environment. For a write-access author that
# adds no exposure (they can already edit workflows); for a fork PR it would,
# so forks are never reviewed here.
#
# CI overrides to the skill's defaults: `--no-commit` (no fix pushes, no
# collapse), the review is always posted as COMMENT (never APPROVE or
# REQUEST_CHANGES — the verdict goes in the body), and no follow-up issues are
# filed. Repo settings let Actions approve PRs, so the review job dismisses any
# approval it leaves — delete that step to let bot approvals count.
#
# A green Review step does not prove a review was posted (#1119: a run on
# #1114 finished `success` and posted nothing), so the job then asserts that
# this run left a review on the head it was started for.
#
# Loop: the `revise` job then runs pr-revise.yml on the review's open threads;
# its push starts the next run of this workflow, up to PR_REVISE_MAX_ROUNDS.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  cooldown:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pr-review-cooldown-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      trusted: ${{ steps.gate.outputs.trusted }}
      unchanged: ${{ steps.replay.outputs.unchanged }}
    steps:
      - name: Gate on author permission
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Gaal's PRs are authored by its app, which is not a collaborator. It
          # only opens PRs from write-access issues (see gaal-agent.yml).
          if [ "$AUTHOR" = "gaal-agent[bot]" ]; then
            echo "trusted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An API error fails the run rather than reading as "not a collaborator".
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission) \
            || { echo "::error::could not read $AUTHOR's permission"; exit 1; }
          case "$perm" in
            admin|maintain|write) echo "trusted=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "trusted=false" >> "$GITHUB_OUTPUT"; echo "$AUTHOR has '$perm' permission; skipping review." ;;
          esac

      - name: Wait 3 minutes (a newer push cancels this and restarts the timer)
        if: steps.gate.outputs.trusted == 'true'
        run: sleep 180

      # A clean automatic rebase (pr-auto-rebase.yml) moves the PR onto a new base
      # without changing its own change, so a review would re-read reviewed code.
      # That workflow says so in its status comment, keyed to the exact head.
      - name: Skip a clean automatic rebase
        id: replay
        if: steps.gate.outputs.trusted == 'true' && github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          n=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"<!-- gaal:clean-replay $HEAD_SHA -->\")))] | length" |
            jq -s add)
          # Only when some earlier head was reviewed: a clean rebase is no reason
          # to skip a change nobody has looked at.
          reviewed=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | length' | jq -s add)
          if [ "${n:-0}" -gt 0 ] && [ "${reviewed:-0}" -gt 0 ]; then
            echo "Head $HEAD_SHA is a clean rebase of an already-reviewed change; skipping the review."
            echo "unchanged=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    needs: cooldown
    if: needs.cooldown.outputs.trusted == 'true' && needs.cooldown.outputs.unchanged != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      # A newer head's review supersedes this one; don't finish reviewing stale code.
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # The baseline for the assert below: a review already on this head from an
      # earlier attempt or event (a re-run, `reopened`) must not count. IDs, not
      # a timestamp: `.submitted_at` is GitHub's clock and `date` is the
      # runner's, so any skew between them would miss a real review or admit an
      # old one.
      - name: Record the reviews already on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" |
            jq -s '[.[][].id]' > "$RUNNER_TEMP/reviews-before.json"

      - name: Review
        id: review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_PAT_FOR_GOOSE }}
          github_token: ${{ github.token }}
          # Gaal's pushes come from its app, so the actor may be its bot.
          allowed_bots: gaal-agent
          claude_args: >-
            --max-turns 200
            --allowedTools "Bash,Read,Glob,Grep,Skill,Task,TodoWrite"
          prompt: |
            /pr-review ${{ github.event.pull_request.number }} --no-commit

            You are running unattended in GitHub Actions. These override the skill:
            - Post the review with event COMMENT, never APPROVE or REQUEST_CHANGES.
              State the verdict you would have given in the first line of the body.
            - Do not file follow-up issues (Step 5.7); list them in the review body instead.
            - Do not push, commit, or collapse anything.

            Output style (terse — the review is read on a phone as often as not):
            - Body: the verdict line, then at most ~15 lines. No preamble about how
              you ran, which gates did not apply, or what the PR does.
            - One line per finding, in the body and in each inline comment:
              `<file>:L<line>: <severity>: <problem>. <fix>.`
              with severity `🔴 blocking`, `🟡 secondary`, `🔵 nit`, `⚪ pre-existing`,
              or `❓ q`. The skill decides which of these open an inline thread.
            - Exact symbols in backticks; a concrete fix, never "consider …".
            - Drop hedging ("might", "perhaps"), restating the diff, and praise.
            - Exception: a security or architecture finding gets one short
              paragraph with the why — then back to one-liners.

      # The action reports `success` when the model stops, whether or not it
      # posted. Count the reviews this run left: the identity `github_token`
      # posts as, on the head this run was started for, absent from the snapshot
      # taken before the step, not PENDING (nobody else can see one), with a
      # body — a thread reply is a review with an empty one, and pr-revise.yml
      # replies under the same identity. Runs only after a successful Review; a
      # failed one has already failed the job. A push that lands while the
      # review is posting moves the review to the new head and fails this run,
      # which only marks the superseded head — the new head gets its own run.
      - name: Assert this run posted a review for the head SHA
        if: steps.review.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # --paginate prints one array per page; -s and .[][] join them.
          n=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" |
            jq -s --arg sha "$HEAD_SHA" --slurpfile before "$RUNNER_TEMP/reviews-before.json" \
              '[.[][] | select(.user.login == "github-actions[bot]"
                and (.id as $id | $before[0] | index($id) | not)
                and .commit_id == $sha
                and .state != "PENDING"
                and ((.body // "") | test("\\S")))] | length')
          if [ "$n" -eq 0 ]; then
            # The skill stops without posting on a PR that is no longer open, so a
            # PR closed during the cooldown or the review is not a missed review.
            state=$(gh pr view "$PR" --repo "$REPO" --json state -q .state)
            if [ "$state" != OPEN ]; then
              echo "PR #$PR is $state; nothing to assert."
              exit 0
            fi
            echo "::error::The review step succeeded but posted no review on PR #$PR for head $HEAD_SHA (none new from github-actions[bot] since the step began)."
            exit 1
          fi
          echo "Found $n review(s) on PR #$PR for head $HEAD_SHA."

      # Actions may approve PRs in this repo and `main` needs one approval, so a
      # bot APPROVE would let an agent-written PR merge unread. The prompt asks
      # for COMMENT; this makes it true regardless of what the model did.
      - name: Dismiss any approval this job left
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')
          failed=0
          for id in $ids; do
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
              -f message="The CI review is advisory; a human approves." -f event=DISMISS ||
              { echo "::error::could not dismiss bot approval $id"; failed=1; }
          done
          exit "$failed"

  # Close the loop in the same run: revise from the review's threads. Calling
  # pr-revise.yml here (not via workflow_run, which only fires from `main`) keeps
  # the loop on the PR's own branch. Its push starts the next review; its gate
  # stops on no open threads, approval, or the round cap.
  revise:
    needs: review
    # A failed review still runs the round: a review bot's gate may have skipped
    # its own round on the promise of this one (pr-revise.yml), and the gate
    # still requires open threads. Skipped (untrusted author) and cancelled
    # (a newer push started its own run) stay skipped. `!cancelled()`, not
    # `always()`: a cancelled run must also stop a round already under way.
    if: ${{ !cancelled() && (needs.review.result == 'success' || needs.review.result == 'failure') }}
    # Every scope pr-revise.yml's jobs ask for: a called workflow cannot hold
    # more than its caller grants, and GitHub refuses the whole run at startup
    # if it asks.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
    uses: $/.github/workflows/pr-revise.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      source: bot
    secrets:
      CLAUDE_PAT_FOR_GOOSE: ${{ secrets.CLAUDE_PAT_FOR_GOOSE }}
      GAAL_APP_PRIVATE_KEY: ${{ secrets.GAAL_APP_PRIVATE_KEY }}
